{% extends "base.html" %}

{% block title %}TRACE - Dashboard{% endblock %}

{% block content %}

<!-- SECTION 1: DASHBOARD HEADING -->
<h1>Dashboard</h1>
<p>TRACE PLC Monitoring & Auditing Overview</p>

<!-- SECTION 2: SQL SERVER STATISTICS -->
<div class="dashboard-grid">

    <!-- SECTION 2A: REGISTERED CONTROLLERS -->
    <section class="panel">
        <h2>Registered Controllers</h2>
        <h1>{{ data.controllers }}</h1>
    </section>

    <!-- SECTION 2B: RECORDED RUNG CHANGES -->
    <section class="panel">
        <h2>Recorded Rung Changes</h2>
        <h1>{{ data.changes }}</h1>
    </section>

    <!-- SECTION 2C: BACKUP RECORDS -->
    <section class="panel">
        <h2>Backups</h2>
        <h1>{{ data.backups }}</h1>
    </section>

</div>

{% endblock %}
