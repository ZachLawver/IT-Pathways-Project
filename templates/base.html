
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TRACE Demonstration{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="trace-shell">

    <aside class="sidebar">

        <div class="trace-brand">
            <img
                src="{{ url_for('static', filename='TRACE Industrial Neon Metal Plate.png') }}"
                alt="TRACE Industrial Version Management"
                class="trace-logo"
            >
        </div>

        <nav class="trace-navigation" aria-label="Main navigation">
            <a href="{{ url_for('demo') }}" class="trace-nav-link active">
                <span class="trace-nav-icon" aria-hidden="true">▣</span>
                <span>Demonstration</span>
            </a>
        </nav>

        <div class="trace-sidebar-footer">
            <span class="trace-sidebar-pulse"></span>
            TRACE VERSION MANAGEMENT
        </div>

    </aside>

    <div class="trace-workspace">

        <div class="trace-topbar">
            <div class="trace-topbar-title">
                INDUSTRIAL CONTROL SYSTEM MANAGEMENT
            </div>

            <div class="trace-topbar-status">
                <span class="trace-status-dot"></span>
                Application Ready
            </div>
        </div>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

    </div>

</div>
</body>
</html>
